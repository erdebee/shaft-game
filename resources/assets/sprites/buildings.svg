<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Building sprites. Each <symbol> is authored in a 0 0 100 100 box and scaled
    into a slot rectangle by <use width/height>, so one sprite serves a 1-slot
    and a 3-slot building without a second drawing.

    This sheet is INLINED into the document at boot (see shaftView.js). A
    <use href="external.svg#id"> would not inherit the page's CSS custom
    properties, so tokens.css could not colour it — and "no raw hex outside
    tokens.css" is a project rule (CONVENTIONS.md).

    Colours therefore come from classes, never attributes:
      .b-shell   outer casing
      .b-detail  internal structure
      .b-hot     furnace glow, lamps, anything lit
      .b-cool    water, glass, air
    Animated parts carry data-part, matching spriteMap.js.
  -->

  <symbol id="sprite-generic-cultivation" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect class="b-shell" x="4" y="20" width="92" height="70" />
    <rect class="b-detail" x="14" y="34" width="30" height="44" />
    <rect class="b-detail" x="56" y="34" width="30" height="44" />
  </symbol>

  <symbol id="sprite-generic-air" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect class="b-shell" x="4" y="20" width="92" height="70" />
    <path class="b-cool" d="M14 40h72M14 55h72M14 70h72" stroke-width="6" />
  </symbol>

  <symbol id="sprite-generator" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect class="b-shell" x="4" y="14" width="92" height="76" />
    <circle class="b-detail" cx="34" cy="52" r="20" />
    <circle class="b-hot" data-part="glow" cx="34" cy="52" r="9" />
    <rect class="b-detail" x="62" y="30" width="26" height="44" />
    <path class="b-detail" d="M62 40h26M62 52h26M62 64h26" stroke-width="3" />
  </symbol>

  <symbol id="sprite-battery" viewBox="0 0 100 100" preserveAspectRatio="none">
